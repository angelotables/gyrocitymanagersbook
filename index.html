<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1E3A5C" />
<title>Gyro City — Managers Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2317395C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>G</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#0E2A47; --navy2:#17395C; --blue:#2E6FA3; --sky:#7FB2DC; --olive:#5C6670; --olive2:#7A8590;
    --tomato:#B23A2A; --amber:#A66A00; --green:#1E7F4F; --ink:#131A22; --faint:#6B7683; --bg:#F5F6F8; --card:#FFFFFF; --line:#E3E6EB; --edge:#E3E6EB; --dim:#8A8378;
    --r:12px; --shadow:0 1px 2px rgba(19,26,34,.05),0 8px 24px -12px rgba(19,26,34,.10);
    --shadow-lg:0 2px 8px rgba(19,26,34,.06),0 18px 44px -16px rgba(19,26,34,.18);
    --disp:'Inter',system-ui,sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14.5px;background:var(--bg);
    font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
  .hdr{background:var(--navy);color:#F4F6F8;
    padding:calc(18px + env(safe-area-inset-top)) 18px 0;position:relative;overflow:hidden;border-radius:0 0 14px 14px;box-shadow:var(--shadow-lg)}
  .hdr::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(127,178,220,.28),transparent 65%);top:-160px;right:-90px;pointer-events:none}
  .hdr::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(200,155,60,.22),transparent 65%);bottom:-120px;left:-70px;pointer-events:none}
  .hdr-in{max-width:680px;margin:0 auto;position:relative;z-index:1}
  .hrow{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.05em;font-family:var(--disp)}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;color:#8FB0CC}
  .hello{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#F4F6F3;
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);
    font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;transition:transform .15s,background .2s}
  .hello:active{transform:scale(.95);background:rgba(255,255,255,.18)}
  .stores{display:flex;gap:5px;margin:16px 0 12px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px}
  .stores button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:14px;font-weight:700;cursor:pointer;background:transparent;
    color:#A9BDD2;font-family:var(--disp);letter-spacing:.02em;transition:all .25s cubic-bezier(.5,1.5,.5,1)}
  .stores button.on{background:#F4F6F3;color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.28);transform:scale(1.02)}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{background:transparent;color:#8FA6BC;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:10px 12px 12px;font-size:11.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;transition:all .18s;font-family:'Inter',sans-serif}
  .tabs button.on{background:transparent;color:#FFFFFF;border-bottom-color:#F4F6F8;box-shadow:none}
  .meander{height:0}
  .daysrow{display:flex;align-items:center;gap:6px;padding-bottom:12px}
  .days{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .arrow{border:1px solid rgba(228,224,212,.8);border-radius:12px;background:var(--card);width:38px;height:54px;font-size:16px;cursor:pointer;
    box-shadow:var(--shadow);color:var(--ink);transition:transform .15s}
  .arrow:active{transform:scale(.9)}
  .day{min-width:64px;border:1px solid var(--line);border-radius:10px;padding:9px 0 8px;background:var(--card);color:var(--ink);
    font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--disp);transition:all .15s}
  .day:active{transform:scale(.97)}
  .day.on{background:var(--navy);color:#fff;border-color:var(--navy);
    box-shadow:0 6px 16px -6px rgba(14,42,71,.45)}
  .day .sub{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;font-weight:400;color:var(--faint);margin-top:3px}
  .day.on .sub{color:#B9CCDE}
  .card{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);padding:15px 16px;margin-bottom:14px;
    box-shadow:var(--shadow);animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .lbl{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:9px}
  .ttl{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--navy2);margin-bottom:9px}
  .dim{color:var(--dim)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#FBFAF6;border-radius:999px;padding:9px 15px;font-size:14px;cursor:pointer;
    font-family:inherit;color:var(--ink);font-weight:500;transition:all .18s}
  .chip:active{transform:scale(.94)}
  .chip.on{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-color:transparent;color:#fff;font-weight:700;
    box-shadow:0 4px 12px rgba(23,57,92,.35)}
  .chip.sev.on{background:linear-gradient(135deg,#A93A26,var(--tomato));box-shadow:0 4px 12px rgba(192,68,46,.4)}
  input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;
    background:#FBFAF6;outline:none;color:var(--ink);transition:border .2s,box-shadow .2s}
  input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,111,163,.12)}
  textarea{min-height:84px;line-height:1.5}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    cursor:pointer;color:#fff;background:var(--navy);font-family:var(--disp);
    box-shadow:0 4px 12px -4px rgba(14,42,71,.35);transition:transform .12s,filter .15s}
  .btn:active{transform:scale(.965);filter:brightness(1.08)}
  .btn.tomato{background:linear-gradient(135deg,#A93A26,var(--tomato));box-shadow:0 6px 16px -4px rgba(192,68,46,.45)}
  .btn.blue{background:linear-gradient(135deg,var(--blue),#4a8cc0)}
  .btn.olive{background:linear-gradient(135deg,#5E6C38,var(--olive2));box-shadow:0 6px 16px -4px rgba(111,122,69,.45)}
  .btn.wide{width:100%}
  .btn[disabled]{opacity:.55}
  .ghost{background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit}
  .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
  .row input,.row select,.row textarea{width:100%;min-width:0}
  .tline{position:relative;margin:4px 0 0 8px;padding-left:22px;border-left:2px solid var(--line)}
  .ev{position:relative;padding:0 0 18px}
  .ev::before{content:'';position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,#5E6C38,var(--olive2));box-shadow:0 0 0 3px rgba(111,122,69,.18)}
  .ev .t{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--faint)}
  .ev .w{font-size:15px;line-height:1.5;margin-top:2px}
  .ev .by{font-weight:700;color:var(--navy2)}
  .ev .x{background:none;border:none;color:var(--faint);font-size:12px;cursor:pointer;padding:2px 6px}
  .banner{border-radius:13px;padding:11px 15px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .banner.err{background:#FBE9E4;color:var(--tomato);border:1px solid #F2CFC5}
  .banner.info{font-size:12.5px;color:#6E5A1B;background:#F8F5EA;border:1px solid #EBE2C8;border-left:3px solid var(--amber)}
  .empty{text-align:center;color:var(--faint);font-size:14.5px;padding:22px 0;line-height:1.6}
  .cnt{font-size:13px;color:var(--faint);margin:2px 2px 12px}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#5E6C38,var(--olive2));color:#fff;border-radius:999px;padding:11px 24px;font-size:14px;
    font-weight:700;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);z-index:60;animation:pop .3s cubic-bezier(.5,1.6,.5,1)}
  @keyframes pop{from{opacity:0;transform:translate(-50%,14px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .pill{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:#fff;border-radius:6px;padding:4px 8px;white-space:nowrap}
  .wcard{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow);
    overflow:hidden;border-left:5px solid var(--tomato);animation:rise .35s ease both}
  .whead{width:100%;background:none;border:none;padding:14px 16px;text-align:left;cursor:pointer;font-family:inherit}
  .wbody{padding:0 16px 16px;border-top:1px solid var(--bg)}
  .field{margin-top:11px}
  .field .fl{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--faint);margin-bottom:3px}
  .field .fv{font-size:14.5px;line-height:1.55;white-space:pre-wrap}
  .prior{background:#F8F5EA;border:1px solid #EBE2C8;border-left:3px solid var(--amber);border-radius:0 10px 10px 0;
    padding:10px 13px;font-size:13.5px;line-height:1.6;margin-bottom:12px;color:#5A4A15}
  .vrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .modal{position:fixed;inset:0;background:rgba(10,31,56,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .modal>div{background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    width:100%;max-width:680px;max-height:82vh;overflow-y:auto;animation:pop .3s cubic-bezier(.5,1.5,.5,1)}
  .wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .wknav .arrow2{background:var(--card);color:var(--ink);border:1px solid rgba(228,224,212,.8);border-radius:12px;width:42px;height:46px;
    font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .wknav .arrow2:active{transform:scale(.9)}
  .wkmid{flex:1;text-align:center}
  .wkmid b{font-size:16px;font-family:var(--disp)}
  .wkmid .sub{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:var(--faint);margin-top:3px}
  .wkmid .sub.pub{color:var(--olive)}
  .dayhdr{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--faint);margin:2px 2px 12px}
  .pos{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow);
    overflow:hidden;border-left:5px solid;animation:rise .35s ease both}
  .pos-h{padding:9px 16px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;font-weight:700}
  .pos-b{padding:8px 14px 13px}
  .shift{display:flex;width:100%;justify-content:space-between;align-items:center;background:#FBFAF6;border:1.5px solid var(--line);
    border-radius:12px;padding:12px 13px;margin-top:8px;cursor:pointer;text-align:left;font-size:15.5px;gap:8px;font-family:inherit;transition:all .15s}
  .shift:active{transform:scale(.98)}
  .shift .t{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--faint);white-space:nowrap}
  .addshift{width:100%;margin-top:8px;border:1.5px dashed;background:transparent;border-radius:12px;padding:12px;font-size:14.5px;
    font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
  .addshift:active{transform:scale(.98)}
  .editbox{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:12px}
  .note{font-size:13px;color:#6E5A1B;background:#F8F5EA;border:1px solid #EBE2C8;border-left:3px solid var(--amber);
    padding:7px 11px;border-radius:0 8px 8px 0;margin-bottom:10px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;padding:4px 6px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--faint);font-weight:400}
  th.c,td.c{text-align:center}
  td{padding:9px 6px;border-top:1px solid var(--bg)}
  .muted{color:var(--faint);font-size:13.5px;line-height:1.55}
  .payrow{display:flex;justify-content:space-between;align-items:baseline}
  .paysum{font-size:26px;font-weight:700;color:var(--navy);font-family:var(--disp)}
  .empline{display:flex;width:100%;justify-content:space-between;background:none;border:none;padding:0;cursor:pointer;
    align-items:baseline;font-size:15px;font-family:inherit}
  .empcard{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:14px;padding:13px 15px;margin-bottom:9px;
    box-shadow:var(--shadow);border-left:4px solid}
  .roledir{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;margin:0 2px 7px;font-weight:700}
  .hcg{display:grid;grid-template-columns:1fr 60px 64px 84px;gap:6px;align-items:baseline}
  .hcg .num{text-align:right;font-variant-numeric:tabular-nums}
  .hch{font-size:9.5px;letter-spacing:.14em;color:var(--dim,#8a8378);font-weight:700;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--edge)}
  .storebar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;pointer-events:none}
  .storepill{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:250;
    border:none;border-radius:999px;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.12em;
    color:#fff;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 6px 20px -6px rgba(19,26,34,.45);
    display:flex;align-items:center;gap:7px;transition:transform .12s}
  .storepill:active{transform:scale(.96)}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .subtabs button{border:1px solid var(--line);background:var(--card);color:var(--faint);border-radius:8px;padding:9px 15px;
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;box-shadow:none;transition:all .15s}
  .subtabs button:active{transform:scale(.97)}
  .subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;
    box-shadow:0 4px 12px rgba(23,57,92,.35)}
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(160deg,#0A1F38 0%,#17395C 55%,#235285 100%);
    padding:calc(40px + env(safe-area-inset-top)) 18px 44px;position:relative;overflow:hidden}
  .login::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(127,178,220,.22),transparent 62%);top:-220px;right:-160px;animation:drift 14s ease-in-out infinite alternate}
  .login::after{content:'';position:absolute;width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,155,60,.2),transparent 62%);bottom:-190px;left:-140px;animation:drift 17s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,26px)}}
  .login h1{color:#F4F6F3;margin:12px 0 2px;font-family:var(--disp);letter-spacing:.06em}
  .login .tag{margin-bottom:26px}
  .lcard{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);border-radius:26px;
    padding:24px 20px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);position:relative;z-index:1;animation:rise .4s ease both}
  .whoami{text-align:center;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px;font-family:var(--disp)}
  .pinsub{text-align:center;font-size:13.5px;color:var(--faint);margin-bottom:16px;line-height:1.55}
  .dots{display:flex;gap:15px;justify-content:center;margin:6px 0 20px}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .15s cubic-bezier(.5,1.6,.5,1)}
  .dot.f{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent;transform:scale(1.18);box-shadow:0 2px 8px rgba(23,57,92,.4)}
  .dots.bad .dot{border-color:var(--tomato);background:#F7E5E1;animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:282px;margin:0 auto}
  .key{border:1px solid var(--line);border-radius:18px;background:#FBFAF6;color:var(--ink);font-size:23px;font-weight:600;padding:16px 0;
    cursor:pointer;font-family:var(--disp);box-shadow:0 2px 5px rgba(14,42,71,.07);transition:all .12s}
  .key:active{transform:scale(.9);background:#EFEBDF;box-shadow:none}
  .key.ghostk{background:transparent;border-color:transparent;box-shadow:none;font-size:18px;color:var(--faint)}
  .by-sub{display:flex;gap:6px;margin-bottom:14px}
  .by-sub button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--faint);border-radius:9px;
    padding:9px 0;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer;font-family:inherit}
  .by-sub button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .by-srow{display:flex;gap:9px;margin-bottom:14px}
  .by-search{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);outline:none;font-size:15px;font-family:inherit}
  .by-search:focus{border-color:var(--navy)}
  .by-mode{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--navy);border-radius:10px;
    color:var(--navy);background:var(--card);font-size:13px;font-weight:800;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  .by-mode svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .by-cat{margin-bottom:20px}
  .by-cath{display:flex;align-items:center;justify-content:space-between;padding:0 2px 7px}
  .by-cath .nme{font-size:14px;font-weight:800;letter-spacing:.1em;color:var(--navy)}
  .by-cath .need{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:#B3261E}
  .by-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .by-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #EEEDE9}
  .by-row > :first-child{flex:1 1 auto;min-width:0}
  .by-row:last-child{border-bottom:none}
  .by-nm{font-weight:600;font-size:14.5px;line-height:1.2}
  .by-meta{font-size:11.5px;color:var(--faint);margin-top:2px}
  .by-seg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .by-seg button{font-size:12px;font-weight:800;letter-spacing:.06em;padding:8px 0;width:48px;color:#98A0AB;
    background:#F7F6F3;border:none;cursor:pointer;font-family:inherit}
  .by-seg button + button{border-left:1px solid var(--line)}
  .by-seg button.g-on{background:#1F6E43;color:#fff}

  const parseT=(t)=>{

    if(mi>59||h2>24)return null;

Employee: ${w.emp}

${w.desc}

  const ordView=html`
    <${Fragment}>
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
        <a href="https://gyrocityordering.netlify.app" target="_blank" rel="noopener" class="ghost" style="color:var(--blue);font-weight:600;text-decoration:none;font-size:13.5px">Open full screen ↗</a>
      </div>
      <iframe src="https://gyrocityordering.netlify.app" style="width:100%;height:calc(100vh - 210px);min-height:520px;border:none;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(23,57,92,.08)" title="Gyro City Orders"></iframe>
    <//>`;

  const mgrLogins=html`
    <${Fragment}>
      <div class="card">
        <div class="ttl">ORDERING APP — ORDERS & OWNER CODES</div>
        <div class="muted mb10">These two shared codes control the Ordering app. Set or replace either anytime; removing one locks that access until you set a new code.</div>
        ${roleCodesSet===null?html`<div class="empty" style="padding:10px 0">⏳ Checking…</div>`:[['orders','Ordering code'],['owner','Owner code']].map(([role,label])=>{
          const has=roleCodesSet.includes(role);
          return html`
            <div key=${role} style="padding:9px 0;border-top:1px solid var(--bg)">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:${has?'0':'7px'}">
                <b style="font-size:14px">${label}</b>
                <span style="display:flex;gap:8px;align-items:center">
                  <span class="mono" style=${{fontSize:'11px',color:has?'var(--green)':'var(--faint)'}}>${has?'set ✓':'not set'}</span>
                  ${has&&(roleClearArm===role
                    ?html`<button class="ghost" style="color:var(--tomato);font-weight:700" disabled=${roleBusy===role} onClick=${()=>clearRoleCode(role)}>${roleBusy===role?'…':'confirm remove'}</button><button class="ghost" onClick=${()=>setRoleClearArm(null)}>cancel</button>`
                    :html`<button class="ghost" style="color:var(--tomato)" onClick=${()=>setRoleClearArm(role)}>Remove</button>`)}
                </span>
              </div>
              <div style="display:flex;gap:8px">
                <input style="flex:1" inputmode="numeric" placeholder=${has?'New code — replaces the current one':'Set a code (4+ digits)'} value=${roleCodeDraft[role]||''} onInput=${e=>setRoleCodeDraft({...roleCodeDraft,[role]:e.target.value})} />
                <button class="btn" style="white-space:nowrap" disabled=${roleBusy===role} onClick=${()=>setRoleCode(role)}>${roleBusy===role?'…':has?'Replace':'Set'}</button>
              </div>
            </div>`;})}
      </div>
      <div class="muted mb12" style="margin:0 2px 12px">Staff set their own 4-digit PIN the first time they open the Staff Book. Forgot a PIN? Reset it here — they'll create a new one next login. Removing someone from the roster (Staff tab) also deletes their login.</div>
      ${loginsWith===null?html`<div class="empty">⏳ Checking who has a PIN…</div>`:html`
        ${POSITIONS.map(pos=>html`
          <div class="mb12" key=${pos.id}>
            <div class="roledir" style=${{color:pos.edge}}>${pos.label.toUpperCase()}S</div>
            ${employees.filter(e=>e.role===pos.id).map(e=>{
              const has=loginsWith.includes(e.id);
              return html`
                <div class="empcard" style=${{borderLeftColor:pos.edge}} key=${e.id}>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                    <b>${e.name}</b>
                    <span style="display:flex;gap:8px;align-items:center">
                      <span class="mono" style=${{fontSize:'11px',color:has?'var(--green)':'var(--faint)'}}>${has?'PIN set ✓':'no PIN yet'}</span>
                      ${has?(loginArm===e.id
                        ?html`<button class="btn tomato" style="padding:7px 11px" disabled=${loginsBusy} onClick=${()=>resetLogin(e.id)}>${loginsBusy?'…':'Confirm reset'}</button><button class="ghost" onClick=${()=>setLoginArm(null)}>cancel</button>`
                        :html`<button class="ghost" style="color:var(--tomato);font-weight:600" onClick=${()=>setLoginArm(e.id)}>Reset PIN</button>`):''}
                    </span>
                  </div>
                </div>`;
            })}
          </div>`)}
      `}
    <//>`;
  const schedView=html`
    <${Fragment}>
      ${schedHeader}
      ${schedTab==='schedule'?mgrSchedule:schedTab==='savail'?mgrAvail:schedTab==='hours'?mgrHours:schedTab==='payroll'?mgrPayroll:schedTab==='logins'?mgrLogins:mgrStaff}
    <//>`;

  const wuForm=html`
    <div class="card" style="border-left:5px solid var(--tomato)">
      <div class="vrow"><b style="font-size:16.5px;color:var(--tomato)">New write-up</b>
        <button class="ghost" onClick=${()=>{setShowForm(false);setWu({});}}>Cancel</button></div>

      <div class="lbl mt12">EMPLOYEE *</div>
      <div class="chips">
        ${staffNames.map(n=>html`<button class=${'chip'+(wu.emp===n?' on':'')} key=${n} onClick=${()=>setWu({...wu,emp:n})}>${n}${empCounts[n]?` (${empCounts[n]})`:''}</button>`)}
      </div>
      <input class="mt8" placeholder="…or type a name not listed" onBlur=${e=>{if(e.target.value.trim())setWu({...wu,emp:e.target.value.trim()});}} />
      ${wu.emp&&priorList(wu.emp)}

      <div class="lbl">WHAT KIND OF ISSUE? *</div>
      <div class="chips">
        ${CATEGORIES.map(c=>html`<button class=${'chip'+(wu.cat===c?' on':'')} key=${c} onClick=${()=>setWu({...wu,cat:c})}>${c}</button>`)}
      </div>

      <div class="lbl mt12">ACTION LEVEL *</div>
      <div class="chips">
        ${SEVERITIES.map(s=>html`<button class=${'chip sev'+(wu.sev===s?' on':'')} key=${s} onClick=${()=>setWu({...wu,sev:s})}>${s}</button>`)}
      </div>

      <div class="lbl mt12">WHEN DID IT HAPPEN?</div>
      <input placeholder=${'Leave blank for now ('+nowStamp()+')'} value=${wu.when||''} onInput=${e=>setWu({...wu,when:e.target.value})} />

      <div class="lbl mt12">WHAT HAPPENED? * — be specific: times, amounts, what was said</div>
      <textarea placeholder="e.g. Scheduled 11AM, arrived 12:40PM with no call. Line was down a cashier through lunch rush." value=${wu.desc||''} onInput=${e=>setWu({...wu,desc:e.target.value})}></textarea>

      <div class="lbl mt12">WITNESSES (optional)</div>
      <input placeholder="Who else saw it" value=${wu.witnesses||''} onInput=${e=>setWu({...wu,witnesses:e.target.value})} />

      <div class="lbl mt12">ACTION TAKEN / EXPECTATIONS GOING FORWARD</div>
      <textarea placeholder="What you told them, what changes, what happens next time" value=${wu.action||''} onInput=${e=>setWu({...wu,action:e.target.value})}></textarea>

      <div class="lbl mt12">EMPLOYEE'S SIDE (their response, in their words)</div>
      <textarea placeholder="What they said when you talked to them" value=${wu.response||''} onInput=${e=>setWu({...wu,response:e.target.value})}></textarea>

      <div class="lbl mt12">ACKNOWLEDGMENT</div>
      <select value=${wu.ack||ACKS[0]} onChange=${e=>setWu({...wu,ack:e.target.value})}>
        ${ACKS.map(a=>html`<option value=${a}>${a}</option>`)}
      </select>

      <div class="lbl mt12">FOLLOW-UP DATE (optional)</div>
      <input placeholder="e.g. re-check in 2 weeks — Aug 1" value=${wu.followup||''} onInput=${e=>setWu({...wu,followup:e.target.value})} />

      <button class="btn tomato wide mt12" disabled=${saving} onClick=${submitWriteup}>${saving?'Saving…':'Save write-up — a copy emails Angelo'}</button>
      <div style="font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5">Saved permanently with your name and today's date. It counts toward ${wu.emp||'the employee'}'s record.</div>
    </div>`;

  const wuList=html`
    <${Fragment}>
      ${!showForm&&html`<button class="btn tomato wide mb12" onClick=${()=>{setShowForm(true);setWu({});}}>+ Write someone up</button>`}
      ${showForm&&wuForm}
      ${writeups.length>0&&html`
        <div class="lbl">FILTER BY EMPLOYEE</div>
        <div class="chips mb12">
          <button class=${'chip'+(filterEmp===null?' on':'')} onClick=${()=>setFilterEmp(null)}>All (${writeups.length})</button>
          ${Object.entries(empCounts).sort((a,b)=>b[1]-a[1]).map(([n,c])=>html`
            <button class=${'chip'+(filterEmp===n?' on':'')} key=${n} onClick=${()=>setFilterEmp(filterEmp===n?null:n)}>${n} (${c})</button>`)}
        </div>`}
      ${!wuLoaded&&html`<div class="empty">⏳ Syncing write-ups…</div>`}
      ${wuLoaded&&shownWu.length===0&&html`<div class="empty">${writeups.length===0?'No write-ups on file.':'None for this filter.'}</div>`}
      ${shownWu.map(w=>{
        const open=openWu===w.id;
        return html`
          <div class="wcard" key=${w.id} style=${{borderLeftColor:sevColor(w.sev)}}>
            <button class="whead" onClick=${()=>setOpenWu(open?null:w.id)}>
              <div class="vrow">
                <b style="font-size:16px">${w.emp}</b>
                <span class="pill" style=${{background:sevColor(w.sev)}}>${w.sev.toUpperCase()}</span>
              </div>
              <div style="font-size:13px;color:var(--faint);margin-top:3px">
                ${w.cat} · ${STORES.find(s=>s.id===w.store)?.label||''} · ${w.at} · by ${w.by}
              </div>
            </button>
            ${open&&html`
              <div class="wbody">
                <div class="field"><div class="fl">INCIDENT</div><div class="fv">${w.when}</div></div>
                <div class="field"><div class="fl">WHAT HAPPENED</div><div class="fv">${w.desc}</div></div>
                ${w.witnesses&&html`<div class="field"><div class="fl">WITNESSES</div><div class="fv">${w.witnesses}</div></div>`}
                ${w.action&&html`<div class="field"><div class="fl">ACTION TAKEN / EXPECTATIONS</div><div class="fv">${w.action}</div></div>`}
                ${w.response&&html`<div class="field"><div class="fl">EMPLOYEE'S SIDE</div><div class="fv">${w.response}</div></div>`}
                <div class="field"><div class="fl">ACKNOWLEDGMENT</div><div class="fv">${w.ack}</div></div>
                ${w.followup&&html`<div class="field"><div class="fl">FOLLOW-UP</div><div class="fv">${w.followup}</div></div>`}
                <div class="field"><div class="fl">PRIORS AT TIME OF NOTICE</div><div class="fv">${w.priorCount}</div></div>
                <div class="row mt12">
                  <button class="btn blue" onClick=${()=>setShareBox({title:'Copy / print this write-up',text:wuText(w)})}>Copy as text</button>
                  ${wuArm===w.id
                    ?html`<button class="btn tomato" onClick=${()=>deleteWriteup(w.id)}>Really delete?</button>`
                    :html`<button class="ghost" style="color:var(--tomato)" onClick=${()=>setWuArm(w.id)}>Delete</button>`}
                </div>
              </div>`}
          </div>`;})}
    <//>`;

  if(!authReady){
    return html`
      <div class="login">
        <h1>GYRO CITY</h1>
        <span class="tag">MANAGERS BOOK</span>
        <div class="tag" style="margin-top:22px">Loading…</div>
      </div>`;
  }
  if(!authed){
    return html`
      <div class="login">
        <h1>GYRO CITY</h1>
        <span class="tag">MANAGERS BOOK</span>
        <form class="lcard" onSubmit=${doLogin}>
          <div class="whoami">Manager sign-in</div>
          <div class="pinsub">Sign in with your manager email and password.</div>
          <div class="lbl mt8">EMAIL</div>
          <input type="email" autocomplete="username" inputmode="email" placeholder="you@example.com" value=${loginEmail} onInput=${e=>{setLoginEmail(e.target.value);setLoginErr('');}} />
          <div class="lbl mt12">PASSWORD</div>
          <input type="password" autocomplete="current-password" placeholder="Your password" value=${loginPw} onInput=${e=>{setLoginPw(e.target.value);setLoginErr('');}} />
          ${loginErr&&html`<div style="color:var(--tomato);font-weight:700;font-size:13px;margin-top:10px">${loginErr}</div>`}
          ${loginNote&&html`<div style="color:var(--green);font-weight:700;font-size:13px;margin-top:10px">${loginNote}</div>`}
          <button class="btn wide mt12" type="submit" disabled=${loginBusy}>${loginBusy?'Signing in…':'Sign in'}</button>
          <button type="button" class="ghost mt12" style="width:100%" onClick=${doReset}>Forgot password?</button>
        </form>
      </div>`;
  }

  return html`
    <${Fragment}>
      ${header}
      <div class="wrap">
        ${connected===false&&html`<div class="banner err"><b>Can't reach the database.</b> Check your internet.</div>`}
        ${err&&html`<div class="banner err">${err}</div>`}
        ${nameCard}
        ${storeSignal}
        ${tab==='log'?logTab:tab==='sched'?schedView:tab==='ord'?ordView:tab==='cat'?cateringView:tab==='by'?backyardView:tab==='xfer'?xferView:tab==='cash'?cashView:wuList}
      </div>
      ${shareBox&&html`
        <div class="modal" onClick=${e=>{if(e.target.classList.contains('modal'))setShareBox(null);}}>
          <div>
            <b style="font-size:16px">${shareBox.title}</b>
            <textarea readonly style="min-height:220px;margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px" onFocus=${e=>e.target.select()}>${shareBox.text}</textarea>
            <div class="row">
              <button class="btn" onClick=${async()=>{try{await navigator.clipboard.writeText(shareBox.text);flash('Copied ✓');}catch{setErr('Tap the text, Select All, copy manually.');}}}>Copy</button>
              <button class="ghost" onClick=${()=>setShareBox(null)}>Done</button>
            </div>
          </div>
        </div>`}
      ${toast&&html`<div class="toast">${toast}</div>`}
    <//>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
